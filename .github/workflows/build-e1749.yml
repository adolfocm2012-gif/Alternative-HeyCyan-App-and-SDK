name: Build E1749 test APK

on:
  push:
    branches:
      - e1749-tunebuds-fix
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build CyanBridge E1749 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

     - name: Set up Android SDK
       uses: android-actions/setup-android@v3
       with:
         packages: platform-tools

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        working-directory: android/CyanBridge
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android/CyanBridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyanBridge-E1749-test
          path: android/CyanBridge/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
